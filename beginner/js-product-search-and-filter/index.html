<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Catalog - Search Filter</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="search-container">
      <div class="search-header">
        <h1 class="app-title">Color Catalog</h1>
        <div class="search-box-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="text"
            placeholder="Search colors..."
            id="search"
            class="search-input"
          />
        </div>
      </div>

      <div class="product-list">
        <div class="product-item">
          <div class="color-preview bg-red"></div>
          <div class="product-detail">
            <h2>Merah</h2>
          </div>
        </div>

        <div class="product-item">
          <div class="color-preview bg-yellow"></div>
          <div class="product-detail">
            <h2>Kuning</h2>
          </div>
        </div>

        <div class="product-item">
          <div class="color-preview bg-blue"></div>
          <div class="product-detail">
            <h2>Biru</h2>
          </div>
        </div>

        <div class="product-item">
          <div class="color-preview bg-green"></div>
          <div class="product-detail">
            <h2>Hijau</h2>
          </div>
        </div>

        <div class="product-item">
          <div class="color-preview bg-pink"></div>
          <div class="product-detail">
            <h2>Pink</h2>
          </div>
        </div>

        <div class="product-item">
          <div class="color-preview bg-purple"></div>
          <div class="product-detail">
            <h2>Ungu</h2>
          </div>
        </div>

        <div class="product-item">
          <div class="color-preview bg-gray"></div>
          <div class="product-detail">
            <h2>Abu Abu</h2>
          </div>
        </div>

        <div class="product-item">
          <div class="color-preview bg-skyblue"></div>
          <div class="product-detail">
            <h2>Biru Langit</h2>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
