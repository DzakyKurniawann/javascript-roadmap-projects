<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie Consent UI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Cookie Banner -->
    <div id="cookieBanner" class="cookie-container">
      <div class="cookie-content">
        <p class="cookie-text">
          We use cookies to enhance your experience. By clicking "Accept", you
          agree to our privacy policy.
        </p>
        <div class="cookie-actions">
          <button id="btnReject" class="btn btn-secondary">Decline</button>
          <button id="btnAccept" class="btn btn-primary">Accept All</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
